<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LOGIX AR Vision - Full Stack Wall AI Audit</title>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.2/build/mp4-muxer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #080C10; font-family: system-ui, -apple-system, sans-serif; color: #E2E8F0; }
        #app-viewport { display: flex; width: 100vw; height: 100vh; }
        #video-container { position: relative; flex: 1; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        #webcam { width: 100%; height: 100%; object-fit: contain; }
        #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #side-panel { width: 420px; height: 100%; background: #0F172A; border-left: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; padding: 20px; gap: 16px; z-index: 10; overflow-y: auto; }
        .panel-header { font-size: 14px; font-weight: 700; color: #38BDF8; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge.alert { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); animation: pulse 1s infinite; }
        
        .stack-matrix { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .matrix-cell { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; }
        .matrix-cell.match { border-color: #10B981; color: #10B981; }
        .matrix-cell.mismatch { border-color: #EF4444; color: #EF4444; background: rgba(239, 68, 68, 0.15); }

        #top-bar { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 12px; z-index: 10; display: flex; gap: 12px; align-items: center; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; box-shadow: 0 0 8px #10B981; }
        .version-pill { background: rgba(56, 189, 248, 0.2); color: #38BDF8; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 11px; font-weight: bold; border: 1px solid rgba(56, 189, 248, 0.4); }
        #export-btn { background: #0284C7; color: #FFF; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; margin-left: 8px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="app-viewport">
        <div id="video-container">
            <div id="top-bar">
                <div style="display:flex; align-items:center; gap:6px;"><span class="dot"></span> AI TRACKER</div>
                <div class="version-pill">v2.1.0-AI</div>
                <div id="time-display">00:00</div>
                <button id="export-btn" onclick="toggleRecord()">EXPORT MP4</button>
            </div>
            <video id="webcam" src="5658160-hd_1920_1080_24fps.mp4" autoplay playsinline muted loop crossorigin="anonymous"></video>
            <canvas id="overlay-canvas"></canvas>
        </div>

        <div id="side-panel">
            <div class="panel-header">STACK WALL PROFILE <span id="audit-badge" class="badge">AI SYNCED</span></div>
            <div style="background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; padding: 16px;">
                <div style="font-size: 11px; color: #94A3B8; margin-bottom: 6px; display: flex; justify-content: space-between;">
                    <span>PHYSICAL STACK MAPPING</span><span id="error-count-text" style="color:#10B981;">0 ERRORS</span>
                </div>
                <div style="font-size: 16px; font-weight: 700; color: #F8FAFC; margin-bottom: 10px;">WALL SECTION B</div>
                <div class="stack-matrix" id="live-matrix-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('time-display');
        const exportBtn = document.getElementById('export-btn');

        let trackFrames = [];
        let isRecording = false;

        // Fetch the multi-container tracking JSON with cache-busting timestamp
        fetch('wall_tracks.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => { 
                trackFrames = data; 
                console.log("Successfully loaded wall_tracks.json frames:", trackFrames.length);
            })
            .catch(err => {
                console.warn("wall_tracks.json fetch failed, using dynamic simulation fallback.");
            });

        function resizeCanvas() {
            canvas.width = video.clientWidth;
            canvas.height = video.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        video.addEventListener('loadedmetadata', resizeCanvas);

        function getRenderedVideoRect() {
            const vw = video.videoWidth || 1920, vh = video.videoHeight || 1080;
            const cw = video.clientWidth, ch = video.clientHeight;
            const vRatio = vw / vh, cRatio = cw / ch;
            let rw, rh, rx, ry;
            if (cRatio > vRatio) { rh = ch; rw = rh * vRatio; rx = (cw - rw) / 2; ry = 0; }
            else { rw = cw; rh = rw / vRatio; rx = 0; ry = (ch - rh) / 2; }
            return { x: rx, y: ry, w: rw, h: rh };
        }

        function getFrameDataForTime(currentTime) {
            if (!trackFrames || trackFrames.length === 0) {
                return [
                    { id: 1, detected_text: "MAXU 501428", box: [0.1, 0.1, 0.38, 0.35], tos_match: true },
                    { id: 2, detected_text: "FALU 164813", box: [0.52, 0.1, 0.38, 0.35], tos_match: true },
                    { id: 3, detected_text: "TEMU 998811", box: [0.1, 0.48, 0.38, 0.35], tos_match: false, expected_text: "TGHU 992211" },
                    { id: 4, detected_text: "MSCU 112233", box: [0.52, 0.48, 0.38, 0.35], tos_match: true }
                ];
            }
            let closest = trackFrames[0];
            for (let f of trackFrames) {
                if (Math.abs(f.timestamp - currentTime) < Math.abs(closest.timestamp - currentTime)) {
                    closest = f;
                }
            }
            return closest ? closest.containers : [];
        }

        function updateSidePanelGrid(containers) {
            const gridContainer = document.getElementById('live-matrix-grid');
            const badge = document.getElementById('audit-badge');
            const errorCountText = document.getElementById('error-count-text');
            
            gridContainer.innerHTML = '';
            let errorCount = containers.filter(c => !c.tos_match).length;

            if (errorCount > 0) {
                badge.className = "badge alert";
                badge.innerText = `${errorCount} MISMATCH FOUND`;
                errorCountText.style.color = "#EF4444";
                errorCountText.innerText = `${errorCount} ERRORS`;
            } else {
                badge.className = "badge";
                badge.innerText = "AI SYNCED";
                errorCountText.style.color = "#10B981";
                errorCountText.innerText = "0 ERRORS";
            }

            containers.forEach(item => {
                const cell = document.createElement('div');
                cell.className = `matrix-cell ${item.tos_match ? 'match' : 'mismatch'}`;
                if (item.tos_match) {
                    cell.innerHTML = `<span><b>${item.detected_text}</b><br>TOS: MATCHED</span><span style="color:#10B981; font-weight:bold;">✓</span>`;
                } else {
                    cell.innerHTML = `<span><b>${item.detected_text}</b><br>⚠️ Expected: ${item.expected_text}</span><span style="color:#EF4444; font-weight:bold;">!</span>`;
                }
                gridContainer.appendChild(cell);
            });
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const t = video.currentTime;
            timeDisplay.innerText = `00:${Math.floor(t).toString().padStart(2, '0')}`;
            const vRect = getRenderedVideoRect();

            const containers = getFrameDataForTime(t);
            updateSidePanelGrid(containers);

            containers.forEach(item => {
                const box = item.box; 
                const color = item.tos_match ? '#10B981' : '#EF4444';
                const x = vRect.x + (box[0] * vRect.w);
                const y = vRect.y + (box[1] * vRect.h);
                const w = box[2] * vRect.w;
                const h = box[3] * vRect.h;

                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);

                if (!item.tos_match) {
                    ctx.fillStyle = '#EF4444';
                    ctx.beginPath();
                    ctx.arc(x + w - 20, y + 20, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('!', x + w - 26, y + 26);
                }

                ctx.fillStyle = color;
                ctx.fillRect(x, y - 26, 140, 22);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(item.detected_text, x + 6, y - 12);
            });

            requestAnimationFrame(renderLoop);
        }

        function toggleRecord() { if (!isRecording) startRecording(); else stopRecording(); }
        async function startRecording() { isRecording = true; exportBtn.innerText = "STOP & SAVE"; exportBtn.classList.add("recording"); video.currentTime = 0; await video.play(); }
        function stopRecording() { isRecording = false; exportBtn.innerText = "EXPORT MP4"; exportBtn.classList.remove("recording"); }

        video.addEventListener('play', () => { resizeCanvas(); requestAnimationFrame(renderLoop); });
        window.addEventListener('load', () => { resizeCanvas(); renderLoop(); });
    </script>
</body>
</html>
